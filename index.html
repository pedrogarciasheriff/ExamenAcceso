            margin: 0 5px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

            display: flex;
            flex-direction: column;

        }
        .question {

        .question b {

        }
        .answer {

        function seleccionarAleatorias(array, cantidad) {
            const copia = [...array];
            const seleccionadas = [];
            for (let i = 0; i < cantidad; i++) {
                const index = Math.floor(Math.random() * copia.length);
                seleccionadas.push(copia.splice(index, 1)[0]);
            }
            return seleccionadas;
        }

        function mostrarPreguntas() {
            // Ocultar botón
            document.getElementById("generateBtn").style.display = "none";

            const seleccionadas = seleccionarAleatorias(todasPreguntas, 30);
            const container = document.getElementById("questionsList");
            container.innerHTML = "";

            // Crear 2 columnas
            const columnas = [];
            for (let i = 0; i < 2; i++) {
                const col = document.createElement("div");
                col.classList.add("column");
                container.appendChild(col);
                columnas.push(col);
            }

            // Distribuir 15 preguntas por columna
            seleccionadas.forEach((p, index) => {
                const div = document.createElement("div");
                div.classList.add("question");
                div.innerHTML = `<b>${index + 1}. ${p.q}</b><div class="answer">${p.a}</div>`;
                const columnaIndex = Math.floor(index / 15); // 15 preguntas por columna
                columnas[columnaIndex].appendChild(div);
            });
